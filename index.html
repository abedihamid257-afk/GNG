<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GNG Search | جستجو</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- صفحه اصلی -->
    <div class="home-page" id="homePage">
        <div class="home-container">
            <div class="gng-logo">
                <span style="color:#4285F4">G</span><span style="color:#EA4335">N</span><span style="color:#FBBC05">G</span>
            </div>
            
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="جستجو در GNG..." onkeypress="handleEnter(event)">
                <button onclick="doSearch()">🔍</button>
            </div>
            
            <div class="search-buttons">
                <button onclick="doSearch()">جستجوی GNG</button>
                <button onclick="feelingLucky()">خوش‌شانسی</button>
            </div>
        </div>
    </div>

    <!-- صفحه نتایج -->
    <div class="results-page" id="resultsPage" style="display:none;">
        <div class="results-header">
            <div class="mini-logo" onclick="goHome()">⚡GNG</div>
            <div class="search-box-small">
                <input type="text" id="resultsInput" onkeypress="handleEnterResults(event)">
                <button onclick="doSearchFromResults()">🔍</button>
            </div>
        </div>
        
        <div class="results-info" id="resultsInfo"></div>
        <div class="results-list" id="resultsList"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
