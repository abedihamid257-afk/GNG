<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="GNG Search - جستجوی سریع با گوگل">
    <title>GNG Search | جستجو</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- هدر GNG -->
    <header class="gng-header">
        <div class="gng-logo" onclick="goHome()" title="رفتن به خانه">
            <span style="color:#4285F4">G</span><span style="color:#EA4335">N</span><span style="color:#FBBC05">G</span>
        </div>
        <span class="gng-tag">Search</span>
        <button class="header-btn" onclick="goHome()">🏠</button>
        <button class="header-btn" onclick="reloadFrame()">🔄</button>
        <button class="header-btn" onclick="openNewTab()">➕</button>
    </header>

    <!-- فریم گوگل -->
    <main class="browser-frame">
        <iframe id="googleFrame" src="https://www.google.com/webhp?igu=1" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe>
    </main>

    <script src="script.js"></script>
</body>
</html>
